name: Check penguins data

on:
  push:
    paths:
      - "data/raw/data_raw_penguins.csv"

jobs:

  check-data:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Check data
        run: Rscript tests/test_data.R